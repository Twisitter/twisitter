<!doctype html>
<!-- Chrome Web Store marquee promo tile, 1400x560. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="frame.css">
<style>
  html, body { width: 1400px; height: 560px; background: #000; color: #fff; }
  .tile { display: flex; align-items: center; gap: 70px; height: 560px; padding: 0 110px; }
  .mark { width: 300px; height: 300px; flex: none; }
  .name { font-size: 100px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; }
  .line { margin-top: 26px; font-size: 46px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.12; }
  .cut { background: linear-gradient(105deg, #fff 0 50%, transparent 50% 54%, var(--blue) 54%); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style></head><body>
<div class="tile">
  <img class="mark" src="mark.svg" alt="">
  <div><div class="name">Twisitter</div><div class="line">See when X <span class="cut">hides</span> your replies from everyone else.</div></div>
</div>
</body></html>
