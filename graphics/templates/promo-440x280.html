<!doctype html>
<!-- Chrome Web Store small promo tile, 440x280. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="frame.css">
<style>
  html, body { width: 440px; height: 280px; background: #000; color: #fff; }
  .tile { display: flex; align-items: center; gap: 22px; height: 280px; padding: 0 30px; }
  .mark { width: 120px; height: 120px; flex: none; }
  .name { font-size: 44px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; }
  .line { margin-top: 12px; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; color: #e7e9ea; }
  .line .blue { color: var(--blue); }
</style></head><body>
<div class="tile">
  <img class="mark" src="mark.svg" alt="">
  <div><div class="name">Twisitter</div><div class="line">See when X <span class="blue">hides</span><br>your replies</div></div>
</div>
</body></html>
